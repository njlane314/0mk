name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            compiler: g++
          - name: macOS
            os: macos-latest
            compiler: clang++

    env:
      CXX: ${{ matrix.compiler }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          header_version="$(sed -n 's/^inline constexpr std::string_view version = "\([^"]*\)";$/\1/p' 0mk.h)"
          if [[ "$version" != "$header_version" ]]; then
            echo "tag version $version does not match 0mk.h version $header_version" >&2
            exit 2
          fi
          system="$(uname -s)"
          architecture="$(uname -m)"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCPACK_SYSTEM_NAME="$system-$architecture"

      - name: Build and test
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Package
        run: cpack --config build/CPackConfig.cmake -G TGZ -B dist

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
